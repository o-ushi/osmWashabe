name: osm_washabe
description: osmWashabe Flutter port
publish_to: 'none'
version: 3.2.1+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.3
  audio_session: ^0.2.3
  just_audio: ^0.10.5
  flutter_local_notifications: ^22.0.1
  uuid: ^4.5.1
  path_provider: ^2.1.4
  timezone: ^0.11.0
  url_launcher: ^6.3.1
  sensors_plus: ^6.1.2
  wakelock_plus: ^1.2.10
  package_info_plus: ^10.1.0
  archive: ^4.0.7
  http: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/image_icon.png
    - assets/images/app_icon.png
    - assets/vosk/vosk-model-small-ja-0.22.zip
